<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>关于本站 · AKHET</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/front.css">
<link rel="stylesheet" href="assets/css/atlas.css">
<script>
(function(){try{var a=JSON.parse(localStorage.getItem('aht.avatar')||'null');if(!a)return;
  function rgb(x){x=x.replace('#','');if(x.length===3)x=x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
    return[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)];}
  function ra(x,al){var c=rgb(x);return'rgba('+c[0]+','+c[1]+','+c[2]+','+al+')';}
  var r=document.documentElement;
  r.style.setProperty('--a1',a.a1);r.style.setProperty('--a2',a.a2);
  r.style.setProperty('--a1-soft',ra(a.a1,.16));r.style.setProperty('--a2-soft',ra(a.a2,.16));
  r.setAttribute('data-avatar',a.key);}catch(e){}})();
</script>
</head>
<body>
<nav class="site-nav"><a class="brand" href="index.html"></a></nav>

<main class="wrap">
  <section class="section-sm">
    <div class="sec-head"><span class="sec-num">ABOUT</span><span class="sec-title">关于本站</span><span class="sec-en">How This Archive Works</span></div>
    <div class="prose md-body" id="about"></div>
  </section>

  <section class="section">
    <div class="sec-head"><span class="sec-num">MEDIA</span><span class="sec-title">书籍载体清单</span><span class="sec-en">Era × Region</span></div>
    <p class="lede">文章与笔记点开后，会以所属时代与国家的书籍形态出现。载体在后台「故事 / 祂的笔记」里逐篇指定。</p>
    <table class="field-table" id="mediaTable"></table>
  </section>
</main>

<footer class="site-foot"><div><a href="index.html">返回首页</a></div></footer>

<script src="assets/js/cloud.js"></script>
  <script src="assets/js/snapshot.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var esc = Common.esc;
  var s = Store.load();
  Common.initNav('about');

  document.getElementById('about').innerHTML = MD.parse(s.site.about || '');
  Common.fillImages(document.getElementById('about'));
  document.title = '关于本站 · ' + s.site.title;

  document.getElementById('mediaTable').innerHTML =
    '<tr><th>载体</th><th>时代</th><th>地区</th><th>形态说明</th></tr>' +
    Store.MEDIUMS.map(function (m) {
      return '<tr><td><b>' + esc(m.name) + '</b><br><span style="font-family:var(--mono);font-size:10.5px;color:var(--ink-3)">' + esc(m.id) + '</span></td>' +
        '<td>' + esc(m.era) + '</td><td>' + esc(m.region) + '</td><td>' + esc(m.hint) + '</td></tr>';
    }).join('');

  Common.reveal();
})();
</script>
</body>
</html>
