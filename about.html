<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>关于本站 · AKHET</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/front.css">
<link rel="stylesheet" href="assets/css/atlas.css">
<script>
(function(){try{var a=JSON.parse(localStorage.getItem('aht.avatar')||'null');if(!a)return;
  function rgb(x){x=x.replace('#','');if(x.length===3)x=x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
    return[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)];}
  function ra(x,al){var c=rgb(x);return'rgba('+c[0]+','+c[1]+','+c[2]+','+al+')';}
  var r=document.documentElement;
  r.style.setProperty('--a1',a.a1);r.style.setProperty('--a2',a.a2);
  r.style.setProperty('--a1-soft',ra(a.a1,.16));r.style.setProperty('--a2-soft',ra(a.a2,.16));
  r.setAttribute('data-avatar',a.key);}catch(e){}})();
</script>
</head>
<body>
<nav class="site-nav"><a class="brand" href="index.html"></a></nav>

<main class="wrap">
  <section class="section-sm">
    <div class="sec-head"><span class="sec-num">ABOUT</span><span class="sec-title">关于本站</span><span class="sec-en">How This Archive Works</span></div>
    <div class="prose md-body" id="about"></div>
  </section>

  <section class="section">
    <div class="sec-head"><span class="sec-num">OFF-SITE</span><span class="sec-title">站外展馆</span><span class="sec-en">Elsewhere</span></div>
    <p class="lede">作者的其他网站：游戏、工具与个人作品。挂着「筹建中」签的还在准备，开放时间定了再挂链接——先记下位置。</p>
    <div class="link-grid" id="offsiteGrid"></div>
  </section>
</main>

<footer class="site-foot"><div><a href="index.html">返回首页</a></div></footer>

<script src="assets/js/cloud.js"></script>
  <script src="assets/js/snapshot.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var esc = Common.esc;
  var s = Store.load();
  Common.initNav('about');

  document.getElementById('about').innerHTML = MD.parse(s.site.about || '');
  Common.fillImages(document.getElementById('about'));
  document.title = '关于本站 · ' + s.site.title;

  /* 站外展馆：数据驱动（后台「站外展馆」页维护，顺序即页面从左到右）。
     url 空 = 筹建中（不可点、挂签）；img 空 = 无渐变底图。 */
  var OFF_DEFAULT = [
    { id: 'o1', name: 'AKHET：擦屁股之旅', en: 'AKHET', desc: '「阿赫特」的游戏宣传与试玩 Demo 页。（暂定名）', url: '', img: '' },
    { id: 'o2', name: '文游写作助手', en: 'WENYOU WRITER', desc: '文游写作助手的在线网页版。', url: 'https://wenyou-writer.pages.dev/', img: '' },
    { id: 'o3', name: '个人作品集', en: 'PORTFOLIO', desc: '作者的其他作品。', url: '', img: '' }
  ];
  var offItems = s.offsite || [];
  /* 访客版旧快照里没有 offsite 字段（本功能上线前的发布），用内置默认三卡兜底，
     保证线上不空；后台改过展馆并重新发布后，这里全按数据走。 */
  if (!offItems.length && s.__ro) offItems = OFF_DEFAULT;
  var grid = document.getElementById('offsiteGrid');
  if (!offItems.length) {
    grid.innerHTML = '<div class="empty">展馆里还没有条目——到后台「站外展馆」添加。</div>';
  } else {
    grid.innerHTML = offItems.map(function (o, i) {
      var num = ('0' + (i + 1)).slice(-2);
      var open = !!o.url;
      var h = '<span class="lc-num">' + num + '</span>' +
        '<h3>' + esc(o.name) + (open ? '<span class="lc-ext">↗</span>' : '') + '</h3>' +
        (o.en ? '<span class="lc-en">' + esc(o.en) + '</span>' : '') +
        (o.desc ? '<p>' + esc(o.desc) + '</p>' : '');
      if (open) {
        return '<a class="link-card is-link" href="' + esc(o.url) + '" target="_blank" rel="noopener">' + h + '</a>';
      }
      return '<div class="link-card">' + h + '<span class="tag tag-gold">筹建中</span></div>';
    }).join('');
    /* 有底图的卡异步取图（IndexedDB / 快照内嵌），拿到再挂，不挡首屏 */
    offItems.forEach(function (o, i) {
      if (!o.img) return;
      Store.imageURL(o.img).then(function (u) {
        if (!u) return;
        var el = grid.children[i];
        if (el) {
          el.style.setProperty('--card-img', 'url("' + u + '")');
          el.classList.add('has-img');
        }
      });
    });
  }

  Common.reveal();
})();
</script>
</body>
</html>
