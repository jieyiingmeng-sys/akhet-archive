<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>插画 · AKHET</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/front.css">
<link rel="stylesheet" href="assets/css/atlas.css">
<script>
(function(){try{var a=JSON.parse(localStorage.getItem('aht.avatar')||'null');if(!a)return;
  function rgb(x){x=x.replace('#','');if(x.length===3)x=x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
    return[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)];}
  function ra(x,al){var c=rgb(x);return'rgba('+c[0]+','+c[1]+','+c[2]+','+al+')';}
  var r=document.documentElement;
  r.style.setProperty('--a1',a.a1);r.style.setProperty('--a2',a.a2);
  r.style.setProperty('--a1-soft',ra(a.a1,.16));r.style.setProperty('--a2-soft',ra(a.a2,.16));
  r.setAttribute('data-avatar',a.key);}catch(e){}})();
</script>
</head>
<body>
<nav class="site-nav"><a class="brand" href="index.html"></a></nav>

<main class="wrap">
  <section class="section-sm">
    <div class="sec-head"><span class="sec-num">09 · GALLERY</span><span class="sec-title">插画</span><span class="sec-en">Illustrations</span></div>
    <p class="lede">立绘、场景与设定图。瀑布流按原始比例排布，点图放大。可用下方分级挑着看——<strong>完成度高</strong>的精草、随手<strong>摸鱼</strong>、以及推进剧情的<strong>故事漫</strong>。</p>
  </section>
  <section class="section-sm">
    <div class="filter-bar" id="tagWrap"></div>
    <div class="gal-cats" id="catWrap"></div>
    <div class="gal-wall" id="wall"></div>
  </section>
</main>

<footer class="site-foot"><div><a href="index.html">返回首页</a>　·　<a href="fanworks.html">网友作品</a></div></footer>

<div class="lightbox" id="lb"><span class="lb-close">×</span><img id="lbImg" alt=""><div class="lb-cap" id="lbCap"></div></div>

<script src="assets/js/cloud.js"></script>
  <script src="assets/js/snapshot.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var esc = Common.esc;
  var s = Store.load();
  Common.initNav('gallery');

  var all = s.gallery || [];
  var tags = [];
  all.forEach(function (g) { (g.tags || []).forEach(function (t) { if (tags.indexOf(t) < 0) tags.push(t); }); });

  /* 分级次级导航 */
  var CATS = [
    { v: 'all',     t: '全部' },
    { v: 'finished', t: '完成度高' },
    { v: 'sketch',  t: '摸鱼' },
    { v: 'manga',   t: '故事漫' }
  ];
  var cat = 'all', picked = [];

  var host = document.getElementById('wall');
  function paint() {
    var list = all.filter(function (g) {
      if (cat !== 'all' && g.cat !== cat) return false;
      return Common.matchTags(g, picked);
    });
    host.innerHTML = list.length ? list.map(function (g) {
      return '<figure class="gal-item reveal" data-i="' + esc(g.id) + '">' +
        '<img class="gi-img md-img" data-img="' + esc(g.imageId || '') + '" alt="' + esc(g.title) + '">' +
        '<figcaption class="gi-cap"><strong>' + esc(g.title) + '</strong><span>' + esc(g.caption || '') + '</span>' +
        ((g.tags || []).length ? '<div class="chips">' + g.tags.map(function (t) { return '<span class="tag tag-gold">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
        '</figcaption></figure>';
    }).join('') : Common.empty('这一分级下还没有插画。到后台「插画」里添加，并选好分级。');
    Common.fillImages(host); Common.reveal(host);
  }

  /* 分级按钮 */
  var catWrap = document.getElementById('catWrap');
  catWrap.innerHTML = CATS.map(function (c) {
    return '<button data-cat="' + c.v + '"' + (c.v === cat ? ' class="on"' : '') + '>' + c.t + '</button>';
  }).join('');
  catWrap.addEventListener('click', function (e) {
    var b = e.target.closest('[data-cat]'); if (!b) return;
    cat = b.getAttribute('data-cat');
    catWrap.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x.getAttribute('data-cat') === cat); });
    paint();
  });

  document.getElementById('tagWrap').appendChild(Common.tagBar(tags, function (cur) { picked = cur; paint(); }));
  paint();

  /* 灯箱：点图放大 */
  var lb = document.getElementById('lb');
  host.addEventListener('click', function (e) {
    var img = e.target.closest('.gi-img'); if (!img || !img.src) return;
    document.getElementById('lbImg').src = img.src;
    var cap = img.parentNode.querySelector('strong');
    document.getElementById('lbCap').textContent = cap ? cap.textContent : '';
    lb.classList.add('open');
  });
  lb.addEventListener('click', function (e) {
    if (e.target.closest('.lb-close') || e.target.id === 'lb') lb.classList.remove('open');
  });
})();
</script>
</body>
</html>
