<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>祂的东西 · AKHET</title>
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/front.css">
<link rel="stylesheet" href="assets/css/atlas.css">
<script>
(function(){try{var a=JSON.parse(localStorage.getItem('aht.avatar')||'null');if(!a)return;
  function rgb(x){x=x.replace('#','');if(x.length===3)x=x[0]+x[0]+x[1]+x[1]+x[2]+x[2];
    return[parseInt(x.slice(0,2),16),parseInt(x.slice(2,4),16),parseInt(x.slice(4,6),16)];}
  function ra(x,al){var c=rgb(x);return'rgba('+c[0]+','+c[1]+','+c[2]+','+al+')';}
  var r=document.documentElement;
  r.style.setProperty('--a1',a.a1);r.style.setProperty('--a2',a.a2);
  r.style.setProperty('--a1-soft',ra(a.a1,.16));r.style.setProperty('--a2-soft',ra(a.a2,.16));
  r.setAttribute('data-avatar',a.key);}catch(e){}})();
</script>
</head>
<body>
<nav class="site-nav"><a class="brand" href="index.html"></a></nav>

<main class="wrap">
  <section class="section-sm">
    <div class="sec-head"><span class="sec-num">06 · THINGS</span><span class="sec-title">祂的东西</span><span class="sec-en">Holdings / Industries / Works</span></div>
    <p class="lede">置物架式堆放。点左边任一件，右边显示它的介绍。</p>
    <div class="view-tabs" id="typeTabs">
      <button class="on" data-t="hold">持有物</button>
      <button data-t="industry">产业</button>
      <button data-t="work">作品</button>
    </div>
  </section>

  <section class="section-sm">
    <div class="shelf-split">
      <div class="shelf" id="shelf"></div>
      <aside class="thing-detail" id="detail"></aside>
    </div>
  </section>
</main>

<footer class="site-foot"><div><a href="index.html">返回首页</a></div></footer>

<script src="assets/js/cloud.js"></script>
  <script src="assets/js/snapshot.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var esc = Common.esc;
  var s = Store.load();
  Common.initNav('things');

  var TYPES = { hold: '持有物', industry: '产业', work: '作品' };
  var cur = 'hold';
  var curId = '';

  function render() {
    var list = (s.things || []).filter(function (t) { return (t.type || 'hold') === cur; });
    var host = document.getElementById('shelf');
    host.innerHTML = list.map(function (t) {
      return '<button class="shelf-item' + (curId === t.id ? ' on' : '') + '" data-i="' + esc(t.id) + '">' +
        '<span class="si-img" data-img="' + esc(t.imageId || '') + '"></span>' +
        '<span class="si-name">' + esc(t.name) + '</span></button>';
    }).join('') || Common.empty('这一类还没有条目。到后台「祂的东西」里添加。');
    Common.fillImages(host);

    host.querySelectorAll('.shelf-item').forEach(function (b) {
      b.onclick = function () { curId = b.getAttribute('data-i'); render(); };
    });

    var d = list.filter(function (t) { return t.id === curId; })[0] || list[0];
    if (d) curId = d.id;
    var box = document.getElementById('detail');
    box.innerHTML = d
      ? '<div class="td-head"><span class="tag tag-gold">' + TYPES[cur] + '</span><h3>' + esc(d.name) + '</h3></div>' +
        '<div class="td-img" data-img="' + esc(d.imageId || '') + '"></div>' +
        '<div class="td-desc">' + esc(d.desc || '（还没有介绍）') + '</div>' +
        ((d.tags || []).length ? '<div class="chips">' + d.tags.map(function (x) { return '<span class="tag tag-gold">' + esc(x) + '</span>'; }).join('') + '</div>' : '') +
        (d.media && d.media.length ? Common.mediaHTML(d) : '')
      : '<div class="dim">选一件看看。</div>';
    Common.fillImages(box);
    Common.fillMedia(box);
  }

  document.getElementById('typeTabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    cur = b.getAttribute('data-t'); curId = '';
    document.querySelectorAll('#typeTabs button').forEach(function (x) { x.classList.toggle('on', x === b); });
    render();
  });

  render();
})();
</script>
</body>
</html>
